name: Build & Update Glossary

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Generate Markdown terms and Index
        run: |
          python scripts/generate_terms_md.py
          python scripts/generate_index.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add terms/ README.md
          
          if git diff --staged --quiet; then
            echo "Değişiklik bulunamadı. Commit adımı atlanıyor."
          else
            git commit -m "chore(auto): update generated terms and readme index [skip ci]"
            git push
          fi
