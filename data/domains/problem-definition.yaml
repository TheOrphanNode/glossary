# Domain: Problem Definition & Framing
domain: problem-definition
title_tr: Problem Tanımı ve Çerçeveleme
description_tr: Yazılım projelerinde çözülmek istenen iş problemini, darboğazları ve hedeflenen değişimi netleştirmek için kullanılan kavramlar.

terms:
  # 1. Temel Problem ve İhtiyaç Terimleri
  - id: problem-statement
    term_en: Problem Statement
    term_tr: Problem İfadesi
    category: core-problem-needs
    definition: Çözümü önceden dayatmadan; mevcut aksaklığı, etkilenen kitleyi ve problemin işletmeye/kullanıcıya maliyetini net bir cümleyle açıklayan resmi problem tanımıdır.
    tags: [problem-framing, business-analysis, discovery]

  - id: pain-point
    term_en: Pain Point
    term_tr: Acı Noktası / Darboğaz
    category: core-problem-needs
    definition: Son kullanıcının veya iş biriminin mevcut süreçte yaşadığı somut zorluk, zaman kaybı, finansal kayıp veya hayal kırıklığıdır.
    tags: [ux, user-research, bottleneck]

  - id: symptom-vs-root-cause
    term_en: Symptom vs. Root Cause
    term_tr: Semptom ve Kök Neden Ayrımı
    category: core-problem-needs
    definition: Yüzeyde görünen yüzeysel belirtiler ile problemin arkasındaki asıl sistemsel kaynağın birbirinden ayırt edilmesidir.
    tags: [analysis, root-cause, diagnostics]

  - id: opportunity-statement
    term_en: Opportunity Statement
    term_tr: Fırsat İfadesi
    category: core-problem-needs
    definition: Problemin negatif dilinden sıyrılarak işletmeye veya kullanıcıya sağlayacağı değeri vurgulayan pozitif fırsat tanımıdır.
    tags: [strategy, value-proposition, ideation]

  - id: how-might-we
    term_en: How Might We (HMW)
    term_tr: Nasıl Yapabiliriz? Sorusu
    category: core-problem-needs
    definition: Bir problemi doğrudan çözüme odaklanmak yerine yaratıcı fikir üretimine açan tasarım odaklı soru kalıbıdır.
    tags: [design-thinking, ideation, framing]

  # 2. Kök Neden ve Problem Keşif Terimleri
  - id: root-cause-analysis
    term_en: Root Cause Analysis (RCA)
    term_tr: Kök Neden Analizi
    category: discovery-root-cause
    definition: Bir aksaklığın sadece sonucunu düzeltmek yerine, problemi kalıcı olarak ortadan kaldırmak için en derindeki temel kaynağı bulma yöntemidir.
    tags: [rca, quality, problem-solving]

  - id: five-whys-technique
    term_en: 5 Whys Technique
    term_tr: 5 Neden Analizi
    category: discovery-root-cause
    definition: Problemin kök nedenine inene kadar ardışık olarak en az 5 kez "Neden?" sorusunu sorarak ilerleme tekniğidir.
    tags: [methodology, rca, lean]

  - id: fishbone-ishikawa-diagram
    term_en: Fishbone / Ishikawa Diagram
    term_tr: Balık Kılçığı Diyagramı
    category: discovery-root-cause
    definition: Bir problemin olası nedenlerini ana kategorilere (İnsan, Süreç, Teknoloji, Çevre, Politika vb.) ayırarak görselleştirme yöntemidir.
    tags: [diagram, quality-management, visualization]

  - id: jobs-to-be-done
    term_en: Jobs to be Done (JTBD)
    term_tr: Yapılacak İşler Çerçevesi
    category: discovery-root-cause
    definition: Kullanıcının bir ürünü veya özelliği satın alırken/kullanırken hayatındaki hangi temel işi veya problemi çözmek istediğini anlama modelidir.
    tags: [framework, product-discovery, user-needs]

  # 3. Mevcut Durum ve Fark Analizi Terimleri
  - id: as-is-analysis
    term_en: As-Is Analysis
    term_tr: Mevcut Durum Analizi
    category: state-gap-analysis
    definition: Sistemin, sürecin veya iş akışının şu anki eksik, hatalı veya yavaş çalışan halinin haritalandırılmasıdır.
    tags: [process-mapping, current-state, analysis]

  - id: to-be-analysis
    term_en: To-Be Analysis
    term_tr: Hedeflenen Durum Analizi
    category: state-gap-analysis
    definition: Problem çözüldükten veya yeni özellik geliştirildikten sonra sistemin nasıl kusursuz çalışacağının kurgulanmasıdır.
    tags: [future-state, design, architecture]

  - id: gap-analysis
    term_en: Gap Analysis
    term_tr: Boşluk / Fark Analizi
    category: state-gap-analysis
    definition: Mevcut durum (As-Is) ile hedeflenen durum (To-Be) arasındaki operasyonel, teknik ve süreçsel farkların tespit edilmesidir.
    tags: [gap-analysis, strategy, roadmap]

  - id: problem-framing
    term_en: Problem Framing
    term_tr: Problem Çerçeveleme
    category: state-gap-analysis
    definition: Belirsiz, karmaşık veya birden fazla departmanı ilgilendiren bir iş konusunu sınırları net, tek bir yazılımsal hedefe indirgeme sürecidir.
    tags: [problem-framing, alignment, scoping]
